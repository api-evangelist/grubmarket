aid: grubmarket
name: Grubmarket
description: GrubMarket is a food technology company founded in 2014 that digitally
  transforms the American food supply chain across the U.S. and Canada. It operates
  a B2B wholesale eCommerce marketplace connecting buyers to thousands of food products,
  an AI-powered ERP and warehouse-management software suite (WholesaleWare) for food
  distributors and growers, and a direct-to-consumer farm-fresh food delivery service.
  Backed by Battery Ventures, GGV Capital, and Y Combinator, GrubMarket was surfaced
  as a portfolio company and added to the API Evangelist network. As of this enrichment
  pass GrubMarket publishes no public developer API, API documentation, or developer
  portal; this profile captures its public web and domain-security posture.
